groups:
  - name: trade-scope-api
    rules:
      - alert: TradeScopeApiDown
        expr: up{job="trade-scope-api"} == 0
        for: 2m
        labels:
          severity: page
          owner: fradotech
        annotations:
          summary: The TradeScope API scrape has been failing for 2 minutes.
          runbook: docs/operations/runbooks.md#a-deploy-made-things-worse

      - alert: TradeScopeErrorRateHigh
        expr: |
          sum(rate(http_requests_total{job="trade-scope-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total{job="trade-scope-api"}[5m])), 0.001)
          > 0.02
        for: 5m
        labels:
          severity: page
          owner: fradotech
        annotations:
          summary: More than 2% of API requests have returned 5xx for 5 minutes.
          runbook: docs/operations/runbooks.md

      - alert: TradeScopeLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{job="trade-scope-api"}[5m])
            )
          ) > 2
        for: 10m
        labels:
          severity: ticket
          owner: fradotech
        annotations:
          summary: The p95 API latency has stayed above 2 seconds for 10 minutes.
          runbook: docs/operations/runbooks.md
