$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'library'
language: 'typescript'

tasks:
  build:
    command: 'pnpm build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'package.json'

  test:
    command: 'pnpm test'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'package.json'
