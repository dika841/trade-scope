version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@tanstack/react-router"
        versions: ["1.170.34", "1.170.35"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
